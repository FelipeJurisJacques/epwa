services:
  engine_progressive_web_application_nginx:
    ports:
      - 80:80
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ../../tests:/usr/share/nginx/html/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    container_name: engine_progressive_web_application_nginx_container
  engine_progressive_web_application_node:
    tty: true
    ports:
      - 9005:9005
    build: ./typescript/
    working_dir: /workspace/
    volumes:
      - ../src/:/workspace/src/
      - ../dist/:/workspace/dist/
      - ../data/logs/:/root/.npm/_logs/
      - ../src/package.json:/workspace/package.json
      - ../src/tsconfig.json:/workspace/tsconfig.json
      - ../data/node_modules/:/workspace/node_modules/
      - ../data/package-lock.json:/workspace/package-lock.json
    container_name: engine_progressive_web_application_node_container
